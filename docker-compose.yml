services:
  db:
    image: postgres:16-alpine
    container_name: mootweb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mootweb
      POSTGRES_PASSWORD: mootweb
      POSTGRES_DB: mootweb
    ports:
      - "5432:5432"
    volumes:
      - mootweb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mootweb -d mootweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: UI web para inspecionar o banco em http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: mootweb-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mootweb-db-data:
